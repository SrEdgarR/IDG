[package]
name = "idg-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
idg-core = { path = "../idg-core" }
idg-protocol.workspace = true
serde_json.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
