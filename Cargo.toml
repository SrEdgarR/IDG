[workspace]
members = ["crates/idg-core", "crates/idg-storage", "crates/idg-protocol", "crates/idg-platform-windows", "crates/idg-runtime", "crates/idg-native-host", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
ts-rs = "=12.0.1"
idg-protocol = { path = "crates/idg-protocol" }
idg-platform-windows = { path = "crates/idg-platform-windows" }

reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
sha2 = "=0.10.9"
