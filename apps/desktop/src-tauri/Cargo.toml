[package]
name = "idg-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
idg-protocol.workspace = true
idg-platform-windows.workspace = true
tokio.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-notification = "=2.4.0"
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
